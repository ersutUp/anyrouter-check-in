name: Workflow Keepalive
on:
  schedule:
    - cron: '0 5 * * 1' # UTC每周一5点
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check last commit age & keepalive
        run: |
          # 获取最近一次提交距今天数
          LAST_COMMIT=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DAYS=$(( (NOW - LAST_COMMIT) / 86400 ))
          echo "Days since last commit: $DAYS"

          if [ $DAYS -ge 45 ]; then
            echo "Trigger keepalive commit"
            echo "$(date)" > .keepalive.timestamp
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .keepalive.timestamp
            git commit -m "chore: auto workflow keepalive"
            git push
          else
            echo "No need keepalive yet"
          fi
